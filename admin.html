<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZAPAI Secure Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f6f7f9;padding:14px}
.box{max-width:600px;margin:auto;background:#fff;padding:16px;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
h2{margin:0 0 10px}input,select,textarea{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font-size:15px}
button{padding:12px 16px;border:0;border-radius:10px;font-weight:700;cursor:pointer}
.btn{background:#111;color:#fff;width:100%}.btn2{background:#25D366;color:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}
.item{display:flex;gap:10px;align-items:center;border:1px solid #eee;padding:8px;border-radius:10px;margin:8px 0}
.item img{width:60px;height:60px;object-fit:cover;border-radius:8px;background:#eee}
#preview{width:100%;max-height:200px;object-fit:cover;border-radius:10px;display:none;margin-top:8px}
.hidden{display:none}
</style></head><body>
<div class="box" id="loginBox"><h2>ZAPAI Secure Admin 🔒</h2><p>Login with your Supabase admin account</p>
<input id="email" type="email" placeholder="Admin Email">
<input id="pass" type="password" placeholder="Password">
<button class="btn" onclick="login()">Login</button><p id="loginMsg" style="color:red"></p><p><a href="index.html">← Back to Shop</a></p></div>
<div class="box hidden" id="adminBox"><h2>ZAPAI Admin ✅</h2><p>Logged in as <b id="who"></b> <button onclick="logout()" style="padding:6px 10px">Logout</button></p>
<input id="name" placeholder="Product name *">
<div class="row"><input id="price" type="number" step="0.01" placeholder="Price K *"><input id="unit" placeholder="Unit e.g. per brick"></div>
<input id="cat" placeholder="Category e.g. Bricks, Cement">
<textarea id="desc" placeholder="Description"></textarea>
<label>Product Photo</label><input id="file" type="file" accept="image/*" onchange="previewImg(event)">
<img id="preview"><input id="imgUrl" placeholder="Or paste image URL">
<input id="sort" type="number" placeholder="Sort order e.g. 1">
<label><input id="active" type="checkbox" checked style="width:auto"> Active (show in shop)</label>
<button class="btn btn2" onclick="saveProduct()">💾 Save Product</button><p id="msg" style="color:green"></p><hr>
<h3>Your Products (<span id="count">0</span>)</h3><div id="list">Loading...</div>
<button class="btn" onclick="loadList()">🔄 Refresh List</button></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL = "https://pexbgqyqamnbzjzgqxvb.supabase.co";
const SB_KEY = "sb_publishable_G_9TK4ueHJBBORUI8f5LTg_IX2tltY6";
const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
let editId=null;
async function checkSession(){const {data}=await supabaseClient.auth.getSession();if(data.session){showAdmin(data.session.user.email);}}
function showAdmin(email){document.getElementById('loginBox').classList.add('hidden');document.getElementById('adminBox').classList.remove('hidden');document.getElementById('who').textContent=email;loadList();}
async function login(){const email=document.getElementById('email').value.trim();const password=document.getElementById('pass').value;const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){document.getElementById('loginMsg').textContent=error.message;return;}showAdmin(data.user.email);}
async function logout(){await supabaseClient.auth.signOut();location.reload();}
function previewImg(e){const f=e.target.files[0];if(!f)return;document.getElementById('preview').src=URL.createObjectURL(f);document.getElementById('preview').style.display='block';}
async function uploadPhoto(){const f=document.getElementById('file').files[0];if(!f)return document.getElementById('imgUrl').value;const name=Date.now()+'-'+f.name.replace(/\s/g,'_');const {error}=await supabaseClient.storage.from('product-image').upload(name,f);if(error)throw error;const {data}=supabaseClient.storage.from('product-image').getPublicUrl(name);return data.publicUrl;}
async function saveProduct(){const name=document.getElementById('name').value.trim();const price=parseFloat(document.getElementById('price').value);if(!name||isNaN(price))return alert('Name + Price required');document.getElementById('msg').textContent='Uploading / Saving...';try{const img=await uploadPhoto();const row={name,price,unit:document.getElementById('unit').value,cat:document.getElementById('cat').value||'Other',description:document.getElementById('desc').value,img:img||'',sort_order:parseInt(document.getElementById('sort').value)||0,active:document.getElementById('active').checked};let res;if(editId)res=await supabaseClient.from('products').update(row).eq('id',editId);else res=await supabaseClient.from('products').insert([row]);if(res.error)throw res.error;document.getElementById('msg').textContent='✅ Saved!';editId=null;clearForm();loadList();}catch(e){document.getElementById('msg').textContent='❌ '+e.message;}}
function clearForm(){['name','price','unit','cat','desc','imgUrl','sort'].forEach(id=>document.getElementById(id).value='');document.getElementById('preview').style.display='none';document.getElementById('file').value='';}
async function loadList(){const {data}=await supabaseClient.from('products').select('*').order('sort_order');document.getElementById('count').textContent=data?.length||0;document.getElementById('list').innerHTML=(data||[]).map(p=>`<div class="item"><img src="${p.img||''}" onerror="this.style.display='none'"><div style="flex:1"><b>${p.name}</b><br><small>K${p.price} • ${p.cat} • ${p.active?'✅ Active':'❌ Hidden'}</small></div><button onclick="editP(${p.id})">Edit</button><button onclick="delP(${p.id})">🗑️</button></div>`).join('')||'No products';}
async function editP(id){const {data}=await supabaseClient.from('products').select('*').eq('id',id).single();if(!data)return;editId=id;document.getElementById('name').value=data.name;document.getElementById('price').value=data.price;document.getElementById('unit').value=data.unit||'';document.getElementById('cat').value=data.cat||'';document.getElementById('desc').value=data.description||'';document.getElementById('imgUrl').value=data.img||'';document.getElementById('sort').value=data.sort_order||0;document.getElementById('active').checked=data.active;if(data.img){document.getElementById('preview').src=data.img;document.getElementById('preview').style.display='block';}window.scrollTo(0,0);}
async function delP(id){if(!confirm('Delete this product?'))return;await supabaseClient.from('products').delete().eq('id',id);loadList();}
checkSession();
</script></body></html>
